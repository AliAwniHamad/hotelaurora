<!DOCTYPE html>
<html lang="sv">
<head>
    <meta name="description" content="Boka din vistelse på Hotell Aurora i Lofoten. Välj datum, rum och tillval.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotell Aurora - Boka</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">AURORA</a>
            <button class="hamburger" onclick="toggleMenu()">☰</button>
            <nav id="meny">
                <a href="index.html">Start</a>
                <a href="boka.html">Boka</a>
                <a href="kontakta.html">Kontakta</a>
                <a href="sevardheter.html">Sevärdheter</a>
                <a href="boka.html" class="boka-knapp">Boka nu</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Boka din vistelse</h1>
        <p>Fyll i formuläret nedan så återkommer vi med en bekräftelse.</p>

        <form action="https://httpbin.org/post" method="post" class="boka-form">

            <fieldset>
                <legend>Vistelse</legend>

                <label for="ankomst">Ankomstdatum:</label>
                <input type="date" id="ankomst" name="ankomst" required>

                <label for="avresa">Avresedatum:</label>
                <input type="date" id="avresa" name="avresa" required>

                <label for="gaster">Antal gäster:</label>
                <input type="number" id="gaster" name="gaster" min="1" max="10" required>

                <label for="rum">Rumstyp:</label>
                <select id="rum" name="rum">
                    <option value="enkel">Enkelrum</option>
                    <option value="dubbel">Dubbelrum</option>
                    <option value="svit">Svit</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Tillval</legend>
                <label><input type="checkbox" name="frukost"> Frukost</label>
                <label><input type="checkbox" name="spa"> Spa</label>
                <label><input type="checkbox" name="parkering"> Parkering</label>
            </fieldset>

            <fieldset>
                <legend>Dina uppgifter</legend>

                <label for="namn">Namn:</label>
                <input type="text" id="namn" name="namn" required minlength="2" maxlength="50">

                <label for="epost">E-post:</label>
                <input type="email" id="epost" name="epost" required>

                <label for="telefon">Telefon:</label>
                <input type="tel" id="telefon" name="telefon">

                <label for="meddelande">Meddelande:</label>
                <textarea id="meddelande" name="meddelande" rows="4" maxlength="500"></textarea>

                <label><input type="checkbox" name="villkor" required> Jag godkänner bokningsvillkoren</label>
            </fieldset>

            <button type="submit" class="knapp">Boka nu</button>
        </form>
    </main>

    <footer>
    <div class="footer-inner">
        <div>
            <p>Storgatan 1, Lofoten</p>
            <p>0123-456 789</p>
            <p>info@aurora.no</p>
        </div>
    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
