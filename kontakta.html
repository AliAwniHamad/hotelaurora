<!DOCTYPE html>
<html lang="sv">
<head>
    <meta name="description" content="Kontakta Hotell Aurora i Lofoten. Adress, telefon, e-post och karta.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotell Aurora - Kontakta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">AURORA</a>
            <button class="hamburger" onclick="toggleMenu()">☰</button>
            <nav id="meny">
                <a href="index.html">Start</a>
                <a href="boka.html">Boka</a>
                <a href="kontakta.html">Kontakta</a>
                <a href="sevardheter.html">Sevärdheter</a>
                <a href="boka.html" class="boka-knapp">Boka nu</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Kontakta Hotell Aurora</h1>

        <div class="kontakt-layout">

            <div class="kontakt-info">
                <h2>Kontaktuppgifter</h2>
                <p>Storgatan 1, Lofoten</p>
                <p>0123-456 789</p>
                <p>info@aurora.no</p>
                <p>Receptionen är öppen alla dagar 07:00-23:00.</p>

               <div class="karta">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d684767.45293188!2d13.060268082443624!3d68.08487832419777!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x45de3f6ae3f3e829%3A0x619c91674bfc3c5d!2sLofoten!5e0!3m2!1sen!2suk!4v1790698038825!5m2!1sen!2suk"
            allowfullscreen=""
            loading="lazy">
    </iframe>
</div>
            </div>

            <div class="kontakt-form">
                <h2>Skicka ett meddelande</h2>
                <form action="https://httpbin.org/post" method="post">
                    <label for="namn">Namn:</label>
                    <input type="text" id="namn" name="namn" required minlength="2">

                    <label for="epost">E-post:</label>
                    <input type="email" id="epost" name="epost" required>

                    <label for="amne">Ämne:</label>
                    <input type="text" id="amne" name="amne">

                    <label for="meddelande">Meddelande:</label>
                    <textarea id="meddelande" name="meddelande" rows="5" required></textarea>

                    <button type="submit" class="knapp">Skicka meddelande</button>
                </form>
            </div>

        </div>
    </main>

    <footer>
    <div class="footer-inner">
        <div>
            <p>Storgatan 1, Lofoten</p>
            <p>0123-456 789</p>
            <p>info@aurora.no</p>
        </div>
    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
